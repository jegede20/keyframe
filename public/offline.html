<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline — Keyframe</title>
  <meta name="theme-color" content="#6C5CE7" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-surface: #12121a;
      --border-subtle: #1e1e2e;
      --text-primary: #f0f0f5;
      --text-secondary: #9494a8;
      --text-tertiary: #5c5c72;
      --accent-primary: #6c5ce7;
      --accent-primary-hover: #7b6ff0;
      --accent-secondary: #00e5a0;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 9999px;
    }
    [data-theme='light'] {
      --bg-primary: #fafafc;
      --bg-surface: #ffffff;
      --border-subtle: #e8e8f0;
      --text-primary: #1a1a2e;
      --text-secondary: #6b6b80;
      --text-tertiary: #9494a8;
      --accent-primary: #5a4bd1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html,
    body {
      height: 100%;
    }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica,
        Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100dvh;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 260px;
      background: radial-gradient(
        ellipse at center,
        var(--accent-primary) 0%,
        transparent 65%
      );
      opacity: 0.12;
      pointer-events: none;
    }
    .icon {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 20px;
      position: relative;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
      position: relative;
    }
    p {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 14px;
      position: relative;
    }
    .note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-tertiary);
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin: 22px 0;
      position: relative;
    }
    button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--accent-primary);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 150ms ease, transform 150ms ease;
      position: relative;
    }
    button:hover {
      background: var(--accent-primary-hover);
    }
    button:active {
      transform: scale(0.98);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 26px;
      font-size: 13px;
      color: var(--text-tertiary);
      position: relative;
    }
    .brand svg {
      color: var(--accent-primary);
      font-weight: 700;
    }
    .brand strong {
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .card {
        animation: rise 400ms ease-out both;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>You're offline</h1>
    <p>
      Keyframe needs an internet connection to read your app's URL and write the
      demo script. Your connection dropped — this page loaded from the app's
      offline cache.
    </p>
    <div class="note">
      <span aria-hidden="true">📜</span>
      <span>Your saved scripts are still here — history works offline.</span>
    </div>
    <button type="button" onclick="window.location.reload()">
      Try Again
    </button>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true" style="flex-shrink:0"><path d="M3.6 16h24.8" stroke="#8B7CF6" stroke-width="2.2" stroke-linecap="round" opacity=".45"/><circle cx="5.4" cy="16" r="1.75" fill="#8B7CF6" opacity=".7"/><circle cx="26.6" cy="16" r="1.75" fill="#8B7CF6" opacity=".7"/><path d="M16 8.8 23.2 16 16 23.2 8.8 16Z" fill="#F0F0F5"/></svg>
      <strong>Keyframe</strong>
      <span>· free, no sign-up</span>
    </div>
  </main>
  <script>
    // Match the user's saved theme so the offline page doesn't flash the wrong palette.
    (function () {
      try {
        var stored = localStorage.getItem('kf_settings');
        var theme = 'dark';
        if (stored) {
          var s = JSON.parse(stored);
          if (s.theme === 'light') theme = 'light';
          else if (s.theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</body>
</html>
